trigger:
- main

pool:
  name: AgentPool-Laptop   # your self-hosted agent pool

steps:
# Step 1: Check if Chocolatey is installed
- script: |
    choco --version || (
      echo "Chocolatey not found, installing..."
      powershell -NoProfile -ExecutionPolicy Bypass -Command \
        "Set-ExecutionPolicy Bypass -Scope Process -Force; \
         [System.Net.ServicePointManager]::SecurityProtocol = \
         [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; \
         iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))"
    )
  displayName: 'Check and Install Chocolatey if missing'

# Step 2: Check if Python is installed, install via Chocolatey if missing
- script: |
    python --version || (
      echo "Python not found, installing with Chocolatey..."
      choco install python --version=3.11.9 -y
    )
  displayName: 'Check and Install Python if missing'

trigger:
- main

pool:
  name: AgentPool-Laptop   # your self-hosted agent pool

steps:
- script: |
    echo %PATH%
    python --version
    choco --version 
  displayName: 'Verify Python availability'
  
- script: python -m pip install --upgrade pip
  displayName: 'Upgrade pip'
  
- script: python -m pip install -r requirements.txt
  displayName: 'Install dependencies'

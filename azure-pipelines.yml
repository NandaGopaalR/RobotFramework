trigger:
- main

pool:
  name: AgentPool-Laptop   # your self-hosted agent pool

steps:
# Step 1: Check if Chocolatey is installed
- script: |
    choco --version || (
      echo "Chocolatey is not installed on this agent."
      exit 1
    )
  displayName: 'Check Chocolatey installation'

# Step 2: Check if Python is installed, install via Chocolatey if missing
- script: |
    python --version || (
      echo "Python not found, installing with Chocolatey..."
      choco install python --version=3.11.9 -y
    )
  displayName: 'Check and Install Python if missing'
